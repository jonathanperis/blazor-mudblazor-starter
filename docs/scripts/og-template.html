<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The Open Graph image (1200x630): the landing page's hero as a printed page. Rendered by scripts/render-brand.mjs. -->
<style>
  @font-face { font-family: "Fraunces"; src: url("../src/fonts/fraunces-latin-wght-normal.woff2"); font-weight: 300 900; }
  @font-face { font-family: "Fraunces"; src: url("../src/fonts/fraunces-latin-wght-italic.woff2"); font-weight: 300 900; font-style: italic; }
  @font-face { font-family: "IBM Plex Mono"; src: url("../src/fonts/ibm-plex-mono-latin-500-normal.woff2"); font-weight: 500; }
  :root { --paper: #F4F1EA; --sheet: #FBFAF6; --ink: #1C1B19; --ink-soft: #5E5A52; --rule: #DDD7CB; --accent: #B4441F; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 600px 1fr; gap: 56px; padding: 52px 0 48px 64px; background: var(--paper); color: var(--ink); }
  .text { display: flex; flex-direction: column; }
  .wordmark { padding-bottom: 18px; border-bottom: 1px solid var(--rule); font: italic 500 36px/1 "Fraunces", serif; letter-spacing: -.01em; }
  .kicker { margin-top: 44px; font: 500 17px/1 "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  h1 { margin-top: 22px; font: 450 84px/1.02 "Fraunces", serif; letter-spacing: -.028em; }
  h1 em { font-style: italic; color: var(--accent); }
  .meta { margin-top: auto; display: flex; justify-content: space-between; padding-top: 16px; border-top: 2px solid var(--ink); font: 500 17px/1 "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
  .plate { align-self: center; position: relative; width: 640px; height: 400px; border: 1px solid var(--ink); background: var(--sheet); box-shadow: 12px 12px 0 -1px var(--paper), 12px 12px 0 0 var(--ink); }
  .plate img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 0 0; }
  figcaption { position: absolute; top: calc(100% + 26px); left: 0; font: italic 400 19px/1 "Fraunces", serif; color: var(--ink-soft); white-space: nowrap; }
  figcaption span { font: 500 15px/1 "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; font-style: normal; color: var(--ink); }
</style>
</head>
<body>
  <div class="text">
    <p class="wordmark">Blazor learning sandbox</p>
    <p class="kicker">A lab manual for Blazor and MudBlazor</p>
    <h1>Learn by changing <em>working</em> examples.</h1>
    <p class="meta"><span>Labs · Components · Samples</span><span>Open source</span></p>
  </div>
  <figure class="plate">
    <img src="../public/screens/gallery-light.jpg" alt="">
    <figcaption><span>Plate 1</span> · The Button page, from the component gallery.</figcaption>
  </figure>
</body>
</html>
