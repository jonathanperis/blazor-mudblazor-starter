<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1B19" />
    <title>Blazor learning sandbox · WebAssembly demo</title>
    <meta name="description" content="Live Blazor WebAssembly demo of the Blazor learning sandbox labs. Runs entirely in the browser." />
    <!-- Publishing for GitHub Pages rewrites this to the demo path (scripts/prepare-pages-demo.py). -->
    <base href="/" />
    <script>
        // GitHub Pages serves 404.html for deep links; it redirects here with the original path in ?p=.
        (function () {
            var params = new URLSearchParams(window.location.search);
            var path = params.get("p");
            if (path !== null && path.charAt(0) === "/" && path.charAt(1) !== "/") {
                history.replaceState(null, "", document.baseURI.replace(/\/$/, "") + path);
            }
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preload" href="_content/WebClient.Shared/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="_content/WebClient.Shared/fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/WebClient.Shared/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <main id="main-content" class="demo-loading">
            <h1>Blazor learning sandbox</h1>
            <p role="status">Starting .NET in your browser…</p>
            <noscript>This live demo runs .NET in your browser and needs JavaScript.</noscript>
        </main>
    </div>
    <div id="blazor-error-ui" role="alert">The app stopped responding. <a href="." class="reload">Reload the page</a>.</div>
    <script src="_content/WebClient.Shared/learning.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        // Caches the runtime for repeat and offline visits (service-worker.published.js). The demo works without it.
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("service-worker.js").catch(function () { });
    </script>
</body>

</html>
