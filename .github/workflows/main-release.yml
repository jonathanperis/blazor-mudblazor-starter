name: Main Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/build-check.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Publish both architectures atomically
        id: image
        uses: docker/build-push-action@v7
        with:
          context: ./src
          file: ./src/WebClient/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest

  deploy:
    if: github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: azure-sandbox
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      WEB_APP: ${{ vars.AZURE_WEBAPP_NAME }}
      PLAN: ${{ vars.AZURE_APP_SERVICE_PLAN }}
      LOCATION: ${{ vars.AZURE_LOCATION || 'brazilsouth' }}
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment configuration
        run: |
          : "${RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP}"
          : "${WEB_APP:?Set AZURE_WEBAPP_NAME}"
          : "${PLAN:?Set AZURE_APP_SERVICE_PLAN}"
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure with the published image digest
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "learning-${GITHUB_RUN_ID}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
              location="$LOCATION" projectName="$RESOURCE_GROUP" \
              webAppName="$WEB_APP" appServicePlanName="$PLAN" \
              appInsightsName="$WEB_APP" logAnalyticsWorkspaceName="$WEB_APP-workspace" \
              containerImage="$IMAGE@$DIGEST" \
            --output none
