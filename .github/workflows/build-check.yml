name: Build Check

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running check. Release calls never cancel.
concurrency:
  group: build-check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: setup-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet test -c Release --no-restore
      - run: dotnet publish src/WebClient -c Release --no-restore -o artifacts/publish
      - name: Verify published application
        run: |
          dotnet artifacts/publish/WebClient.dll --contentRoot "$PWD/artifacts/publish" --urls http://127.0.0.1:5030 --Learning:ApiBaseUrl=http://127.0.0.1:5030/ &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python3 scripts/smoke-http.py --base-url http://127.0.0.1:5030

  # Builds the GitHub Pages site exactly as it is deployed: the Astro guide plus the WebAssembly demo under /demo/.
  # On main the validated site becomes the Pages artifact that the release workflow deploys.
  pages:
    # Keeps the protected-branch check name from before the job also built the WebAssembly demo.
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: docs/.node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: docs/package.json
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun audit
        working-directory: docs
      - run: npm run check:drift && npm run check:types && npm run build
        working-directory: docs
        env:
          PUBLIC_GA_ID: ${{ github.event_name != 'pull_request' && secrets.PUBLIC_GA_ID || '' }}
      - name: Publish and prerender the WebAssembly demo into the site
        run: |
          dotnet restore src/WebClient.Wasm --locked-mode
          dotnet restore src/WebClient.Prerender --locked-mode
          dotnet publish src/WebClient.Wasm -c Release --no-restore -o artifacts/wasm
          dotnet run --project src/WebClient.Prerender -c Release --no-restore -- artifacts/wasm/wwwroot
          python3 scripts/prepare-pages-demo.py
      - run: npm run check:rendered
        working-directory: docs
      # Uses the Google Chrome preinstalled on GitHub-hosted Ubuntu runners: no browser download or apt step.
      - name: Check the demo in a browser
        working-directory: docs
        timeout-minutes: 10
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: npm run check:demo
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/out

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile infrastructure and require the committed ARM template to match
        run: |
          az bicep install --version v0.47.16
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
          python3 - "$RUNNER_TEMP/main.json" infra/main.json <<'PY'
          import json, sys
          def load(path):
              template = json.load(open(path, encoding="utf-8"))
              template.get("metadata", {}).pop("_generator", None)
              return template
          if load(sys.argv[1]) != load(sys.argv[2]):
              raise SystemExit("infra/main.json is stale: run az bicep build --file infra/main.bicep")
          PY
      - name: Lint workflows and shell steps
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  container:
    needs: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        ready-to-run: ['false', 'true']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./src
          file: ./src/WebClient/Dockerfile
          push: false
          load: true
          tags: learning-sandbox:check
          build-args: |
            BUILD_CONFIGURATION=Release
            READY_TO_RUN=${{ matrix.ready-to-run }}
      - name: Check container readiness and prerendered routes
        run: |
          docker run -d --name learning-check -p 5030:5000 learning-sandbox:check
          trap 'docker logs learning-check; docker rm -f learning-check' EXIT
          python3 scripts/smoke-http.py --base-url http://127.0.0.1:5030
      - name: Scan container dependencies
        if: matrix.ready-to-run == 'false'
        run: |
          docker image save --output "$RUNNER_TEMP/learning-sandbox.tar" learning-sandbox:check
          docker run --rm \
            -v "$RUNNER_TEMP/learning-sandbox.tar:/scan/image.tar:ro" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress

  container-test:
    needs: container
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete container matrix to pass
        env:
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$CONTAINER_RESULT" = success
