name: Build Check

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  dotnet:
    name: setup-build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet test -c Release --no-restore
      - run: dotnet publish src/WebClient -c Release --no-restore -o artifacts/publish
      - name: Verify published application
        run: |
          dotnet artifacts/publish/WebClient.dll --contentRoot "$PWD/artifacts/publish" --urls http://127.0.0.1:5030 --Learning:ApiBaseUrl=http://127.0.0.1:5030/ &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python3 scripts/smoke-http.py --base-url http://127.0.0.1:5030

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun audit
        working-directory: docs
      - run: npm run check:drift && npm run build && npm run check:rendered
        working-directory: docs

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile infrastructure and parameters
        run: |
          az bicep install --version v0.41.2
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/main.bicepparam --stdout > /dev/null
      - name: Lint workflows and shell steps
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  container:
    needs: dotnet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ready-to-run: ['false', 'true']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./src
          file: ./src/WebClient/Dockerfile
          push: false
          load: true
          tags: learning-sandbox:check
          build-args: |
            BUILD_CONFIGURATION=Release
            READY_TO_RUN=${{ matrix.ready-to-run }}
      - name: Check container readiness and prerendered routes
        run: |
          docker run -d --name learning-check -p 5030:5000 learning-sandbox:check
          trap 'docker logs learning-check; docker rm -f learning-check' EXIT
          python3 scripts/smoke-http.py --base-url http://127.0.0.1:5030
      - name: Scan container dependencies
        if: matrix.ready-to-run == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: learning-sandbox:check
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          scanners: vuln

  container-test:
    needs: container
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete container matrix to pass
        env:
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: test "$CONTAINER_RESULT" = success
